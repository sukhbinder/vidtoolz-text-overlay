[project]
name = "vidtoolz-text-overlay"
version = "0.1.0"
description = "Add text overlay on video using ffmpeg"
readme = "README.md"
authors = [{name = "Sukhbinder Singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-text-overlay"
Changelog = "https://github.com/sukhbinder/vidtoolz-text-overlay/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-text-overlay/issues"
CI = "https://github.com/sukhbinder/vidtoolz-text-overlay/actions"

[project.entry-points."vidtoolz_plugins"]
otext = "vidtoolz_text_overlay:otext_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
